<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団ハレトケ | 公式サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">劇団ハレトケ</div>
        <nav>
            <ul>
                <li>ホーム</li><li>劇団紹介</li><li>公演情報</li><li>メンバー</li><li>お問い合わせ</li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 id="site-tagline"></h1>
                <p id="site-description"></p>
                <div class="buttons">
                    <a href="#" class="btn gold">最新公演を見る</a>
                    <a href="#" class="btn outline">劇団について</a>
                </div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">最新・過去の公演</h2>
            <div id="performance-grid" class="grid">
                </div>
        </section>

        <section class="section bg-dark">
            <h2 class="section-title">ニュース</h2>
            <ul id="news-list" class="news-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
